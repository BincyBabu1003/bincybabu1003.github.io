<body>
<header>
    <h1>Contact</h1>

            Visit my LinkedIn
        </a>
    </p>
</section>

<button class="floating-contact" onclick="window.location.href='contact.html'">
    Let’s Connect
</button>

<div id="chatbot">
    <div id="chatbot-header">Ask about my work</div>

    <div id="chatbot-body"></div>

    <div id="chatbot-input-area">
        <input type="text" id="chatbot-input" placeholder="Type your question...">
        <button id="chatbot-send">Send</button>
    </div>
</div>

<footer>
    <p>© 2026 Bincy Babu</p>
</footer>
<script>
const input = document.getElementById("chatbot-input");
const sendBtn = document.getElementById("chatbot-send");
const body = document.getElementById("chatbot-body");

// Bot responses logic
function getBotResponse(message) {
    message = message.toLowerCase();

    if (message.includes("thesis") || message.includes("volvo")) {
        return "🏆 Thesis: Defect detection in Volvo battery lids using computer vision (YOLO/CNN).";
    }

    else if (message.includes("brain") || message.includes("tumor")) {
        return "🧠 Brain Tumor Segmentation: MRI-based deep learning using U-Net/CNN models.";
    }

    else if (message.includes("rag") || message.includes("chatbot")) {
        return "🔍 RAG Chatbot: Retrieval-Augmented Generation using embeddings + vector database + LLM.";
    }

    else if (message.includes("skills")) {
        return "📊 Skills: Machine Learning, Deep Learning, Computer Vision, NLP, LLMs.";
    }

    else {
        return "Ask me about: thesis, brain tumor segmentation, RAG chatbot, or skills 😊";
    }
}

// Add message to chat
function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.classList.add("chatbot-message");
    msg.classList.add(sender);
    msg.innerText = text;
    body.appendChild(msg);
    body.scrollTop = body.scrollHeight;
}

// Handle send
function sendMessage() {
    const message = input.value;
    if (!message.trim()) return;

    // user message
    addMessage(message, "user");

    // bot reply
    const reply = getBotResponse(message);
    setTimeout(() => {
        addMessage(reply, "bot");
    }, 500);

    input.value = "";
}

// Events
sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
</script>
</body>
